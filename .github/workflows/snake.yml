name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Satyam216
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff6600&color_dots[]=161b22&color_dots[]=0e4429&color_dots[]=006d32&color_dots[]=26a641&color_dots[]=39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ff6600
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
